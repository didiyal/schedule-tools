# TodoSync 同步枢纽 443 反代（2026-10-26）— 自签证书+客户端钉证书方案
# 不含 default_server 标记，不影响其他站点；后端 systemd todosync → 127.0.0.1:5000
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /www/server/nginx/conf/cert/todosync.crt;
    ssl_certificate_key /www/server/nginx/conf/cert/todosync.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_http_version 1.1;
        proxy_cache off;   # BT 全局 proxy_cache(cache_one) 会把无 Content-Length 的 POST 打成双重 400，必须关
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
